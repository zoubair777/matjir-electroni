<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — لوحة تحكم {{ site.site_name }}</title>
<link rel="icon" type="image/jpeg" href="{{ url_for('static', filename=site.logo_path) }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="brand-mark">
      <img src="{{ url_for('static', filename=site.logo_path) }}" alt="{{ site.site_name }}">
    </div>
    <h1>لوحة تحكم المتجر</h1>
    <p class="sub">سجّل الدخول لإدارة {{ site.site_name }}</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('admin_login') }}" style="text-align:right;">
      <div class="field">
        <label for="username">اسم المستخدم</label>
        <input type="text" id="username" name="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">تسجيل الدخول</button>
    </form>
  </div>
</body>
</html>
