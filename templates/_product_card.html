<div class="product-card">
  <div class="product-thumb">
    {% if p.is_featured %}<span class="badge-featured">مميز</span>{% endif %}
    {% if p.image_path %}
      <img src="{{ url_for('static', filename=p.image_path) }}" alt="{{ p.name }}" loading="lazy">
    {% else %}
      <span class="placeholder">﴾ ﴿</span>
    {% endif %}
  </div>
  <div class="product-body">
    {% if p.category_name is defined and p.category_name %}<div class="product-cat">{{ p.category_name }}</div>{% endif %}
    <h3>{{ p.name }}</h3>
    <p class="desc">{{ p.description }}</p>
    <div class="product-foot">
      <span class="price">{{ "%.0f"|format(p.price) }} د.ل</span>
      <a class="icon-link" href="https://wa.me/{{ site.whatsapp_number }}?text=مرحبًا، أرغب بالاستفسار عن: {{ p.name }}" target="_blank" rel="noopener" aria-label="استفسار عبر واتساب">
        <svg width="18" height="18" viewBox="0 0 32 32" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M16.02 3C9.4 3 4.03 8.37 4.03 15c0 2.2.6 4.26 1.63 6.03L3 29l8.15-2.6A11.9 11.9 0 0 0 16.02 27C22.64 27 28 21.63 28 15S22.64 3 16.02 3Z"/>
        </svg>
      </a>
    </div>
  </div>
</div>
