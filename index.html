<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matjir Electroni</title>
    <link rel="stylesheet" href="./dist/styles.css">
</head>
<body class="bg-gray-100">
    <div id="app" class="container mx-auto">
        <header class="py-5">
            <h1 class="text-3xl font-bold text-center">Matjir Electroni</h1>
        </header>
        <main>
            <div class="my-4 flex justify-center">
                <input type="text" id="product-search" placeholder="Search Products" class="border p-2 rounded w-full max-w-md"/>
            </div>
            <div id="product-list" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
        </main>
        <footer class="py-4 text-center">
            <button id="view-cart" class="bg-blue-500 text-white px-4 py-2 rounded">View Cart</button>
        </footer>
    </div>
    <script src="./app.js"></script>
</body>
</html>
